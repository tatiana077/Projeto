<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Kerolê - Livros Disponíveis</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1>Kerolê 📚</h1>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="cadastro.html">Cadastrar Livro</a></li>
          <li><a href="#lista">Livros</a></li>
          <li><a href="#chat">Chat</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="lista">
        <h2>Livros Disponíveis</h2>
        <div id="livros" class="grid"></div>
      </section>

      <section id="chat">
        <h2>Minhas Conversas</h2>
        <ul id="conversas">
          <!-- Exemplo -->
          <li><a href="chat.html?dono=Maria">Maria</a></li>
          <li><a href="chat.html?dono=João">João</a></li>
        </ul>

        <div id="mensagens"></div>
        <form id="chatForm">
          <input
            type="text"
            id="mensagem"
            placeholder="Digite sua mensagem..."
            required
          />
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Kerolê - Comunidade de Gurupi-TO</p>
    </footer>

    <script src="script.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
